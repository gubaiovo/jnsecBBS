version: '2.4'

services:
  mysql:
    image: mysql:5.7
    container_name: bbs-mysql
    restart: unless-stopped
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: ${TZ}
    volumes:
      - bbsmysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  php:
    image: jnsecbbs:php8.3.36
    container_name: bbs-php
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8081:80"
    volumes:
      - wwwdata:/var/www/bbs
      - bbslog:/var/log/apache2
    environment:
      TZ: ${TZ}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  app:
    image: bbs:latest
    build:
      context: .
    container_name: bbs-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "${APP_PORT}:8080"
    environment:
      JNSEC_LISTEN: 0.0.0.0:8080
      JNSEC_SITE_NAME: ${SITE_NAME}
      JNSEC_DB_DRIVER: mysql
      JNSEC_DB_DSN: ${APP_DB_DSN:?Set APP_DB_DSN to the application database DSN}
      JNSEC_SESSION_SECRET: ${SESSION_SECRET}
      JNSEC_COOKIE_SECURE: ${COOKIE_SECURE}
      JNSEC_TRUSTED_ORIGINS: ${TRUSTED_ORIGINS}
      JNSEC_TRUST_PROXY: "true"
      JNSEC_DATA_DIR: /app/data
      # 旧站头像/附件目录。保留内联默认值：缺失时 /assets 路由不注册，旧用户头像会静默丢失
      JNSEC_ASSETS_DIR: ${ASSETS_DIR:-/flarum/public/assets}
      JNSEC_REGISTRATION: ${REGISTRATION}
      JNSEC_READ_ONLY: ${READ_ONLY:-false}
      TZ: ${TZ}
    volumes:
      - appdata:/app/data
      - wwwdata:/flarum:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- -T 3 http://127.0.0.1:8080/api/health >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  bbsmysql:
    external: true
  wwwdata:
    external: true
  bbslog:
    external: true
  appdata: {}
