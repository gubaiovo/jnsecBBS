name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    name: Go（fmt / vet / test）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt 格式检查
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::以下文件未通过 gofmt，请运行 gofmt -w："
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race -count=1 ./...

      - name: 部署脚本回归测试
        run: |
          bash -n run.sh
          python3 -m unittest discover -s scripts/tests -p 'test_deploy.py' -v

  frontend:
    name: Frontend（bun 构建校验）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: 安装依赖
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: 构建校验（tsc 类型检查 + vite 打包）
        working-directory: frontend
        run: bun --bun run build

  migration:
    name: MySQL 5.7（镜像与独立 schema 转换）
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: integration-test-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pintegration-test-only --silent"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Native snapshot integration
        env:
          BBS_NATIVE_TEST_DSN: root:integration-test-only@tcp(127.0.0.1:3306)/mysql
        run: go test -race ./internal/migration
      - name: Legacy mirror integration
        env:
          BBS_SYNC_TEST_MYSQL: ${{ job.services.mysql.id }}
        run: python3 -m unittest discover -s scripts/tests -p 'test_sync.py' -v

  deploy:
    name: 部署（SSH → run.sh）
    needs: [go, frontend, migration]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: 检查部署 Secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_FINGERPRINT: ${{ secrets.VPS_FINGERPRINT }}
        run: |
          for required in VPS_HOST VPS_USER VPS_SSH_KEY VPS_FINGERPRINT; do
            if [ -z "${!required}" ]; then
              echo "::error::缺少部署 Secret：$required"
              exit 1
            fi
          done
      # VPS 侧 authorized_keys 用 restrict + 强制命令锁定为
      # cd /opt/backup/refactorBBS/jnsecBBS && chmod +x run.sh && ./run.sh
      # run.sh 严格解析 SSH_ORIGINAL_COMMAND 中的 deploy <SHA>，无需修改
      # 现有无参数强制命令；仅允许 CI 对应的当前 origin/main 提交。
      # fingerprint 必须是握手实际协商算法的主机指纹：Go SSH 客户端对这台
      # VPS 实测协商出 ECDSA；换服务器后需用 Go 客户端重测，勿凭经验猜算法。
      - name: SSH 部署
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ secrets.VPS_FINGERPRINT }}
          command_timeout: 30m
          script: deploy ${{ github.sha }}
