name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    name: Go（fmt / vet / test）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt 格式检查
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::以下文件未通过 gofmt，请运行 gofmt -w："
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race -count=1 ./...

  frontend:
    name: Frontend（bun 构建校验）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 安装依赖
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: 构建校验（tsc 类型检查 + vite 打包）
        working-directory: frontend
        run: bun run build

  deploy:
    name: 部署（SSH → run.sh）
    needs: [go, frontend]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: 检查部署 Secrets
        id: creds
        run: |
          if [ -z "${{ secrets.VPS_HOST }}" ] || [ -z "${{ secrets.VPS_USER }}" ] || [ -z "${{ secrets.VPS_SSH_KEY }}" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::未配置 VPS_HOST / VPS_USER / VPS_SSH_KEY Secrets，本次跳过部署"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      # VPS 侧 authorized_keys 用 restrict + 强制命令锁定为
      # cd /opt/backup/refactorBBS/jnsecBBS && chmod +x run.sh && ./run.sh
      # 此处发送的命令内容仅作说明，实际执行以 VPS 侧锁定为准。
      # fingerprint 必须是握手实际协商算法的主机指纹：Go SSH 客户端对这台
      # VPS 实测协商出 ECDSA；换服务器后需用 Go 客户端重测，勿凭经验猜算法。
      - name: SSH 部署
        if: steps.creds.outputs.ready == 'true'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ secrets.VPS_FINGERPRINT }}
          command_timeout: 30m
          script: |
            cd /opt/backup/refactorBBS/jnsecBBS
            chmod +x run.sh
            ./run.sh
