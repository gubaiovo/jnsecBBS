# JNSEC BBS 生产配置（bbs.jnsec.org）
listen: "0.0.0.0:8080"
site_name: "JNSEC BBS"
timezone: "Asia/Shanghai"
data_dir: "./data"
session_secret: "CHANGE-ME-to-a-random-64-char-string"
cookie_secure: true
trust_proxy: true
# CSRF 同源校验白名单：站点所有可能的访问 Origin（新站子域名 / 主域全量切换后）
trusted_origins:
  - "https://bbs.jnsec.org"
  - "https://new.bbs.jnsec.org"

database:
  driver: "mysql"
  dsn: "bbs:CHANGE-ME@tcp(127.0.0.1:3306)/flarum?charset=utf8mb4&parseTime=true&loc=Local"

registration: "invite"
assets_dir: "/flarum/public/assets"
log_level: "info"
